apiVersion: v1
kind: Service
metadata:
  name: nest-demo-stable      # always points at the last-good (stable) pods
  namespace: demo
spec:
  selector:
    app: nest-demo
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nest-demo-canary      # points ONLY at canary pods during a rollout
  namespace: demo
spec:
  selector:
    app: nest-demo
  ports:
    - port: 80
      targetPort: 3000